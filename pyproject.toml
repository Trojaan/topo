[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topo-context-engine"
dynamic = ["version"]
description = "Local-first financial context engine"
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.23,<5",
  "types-pyyaml>=6.0.12,<7",
]
build = [
  "pyinstaller>=6.15,<7",
]

[project.scripts]
topo = "topo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/topo"]

[tool.hatch.version]
path = "src/topo/__about__.py"

[tool.pytest.ini_options]
testpaths = ["tests", "e2e"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "e2e", "scripts/check_architecture.py"]
mypy_path = "src"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
