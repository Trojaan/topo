[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topo-context-engine"
version = "0.1.0"
description = "Local-first financial context engine"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.23,<5"]

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
topo = "topo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/topo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["topo"]
mypy_path = "src"
