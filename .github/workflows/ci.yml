name: CI

on:
  push:
  pull_request:

jobs:
  commit-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a conventional PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?:\ .+ ]]; then
            echo "Use a conventional PR title, for example: feat(cli): describe contracts"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/check_architecture.py
      - run: uv run mypy
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  windows-installer-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows installer
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "install.ps1"), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv build
      - run: uv venv --python 3.14 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/*.whl
      - run: .wheel-venv/bin/python -c "import topo; import topo_v2"
      - run: .wheel-venv/bin/topo2 contract --json
      - run: .wheel-venv/bin/topo2 init --context "${RUNNER_TEMP}/context.json" --json
      - run: .wheel-venv/bin/topo2 summary --context "${RUNNER_TEMP}/context.json" --json
      - run: .wheel-venv/bin/topo contract describe --json
      - run: .wheel-venv/bin/topo context init --package "${RUNNER_TEMP}/smoke.topo" --json

  standalone-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev --group build
      - run: uv run pyinstaller --clean topo.spec
      - run: uv run pyinstaller --clean topo2.spec
      - run: dist/topo --version
      - run: dist/topo contract describe --json
      - run: dist/topo init "${RUNNER_TEMP}/workspace" --json
      - run: dist/topo context status --package "${RUNNER_TEMP}/workspace/context.topo" --json
      - run: dist/topo2/topo2 --version
      - run: uv run python scripts/smoke_topo2.py dist/topo2/topo2 --output test-results/topo2-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: topo2-standalone-proof
          path: test-results/topo2-smoke.json
          if-no-files-found: error
